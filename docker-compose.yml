services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dmv2
      POSTGRES_PASSWORD: dmv2
      POSTGRES_DB: dmv2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmv2 -d dmv2"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://dmv2:dmv2@db:5432/dmv2
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  pgdata:
